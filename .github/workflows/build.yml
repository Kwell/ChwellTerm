name: Desktop build
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-args: --bundles nsis
          - os: macos-latest
            build-args: --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        run: pnpm test
      - if: runner.os == 'Windows'
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        run: pnpm desktop:build ${{ matrix.build-args }}
      - uses: actions/upload-artifact@v4
        with:
          name: chwellterm-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            output/macos/**/*.zip
            output/macos/**/*.dmg
            output/macos/**/SHA256.txt
